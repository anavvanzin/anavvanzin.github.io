<style>
  body { min-height:100vh; background:var(--paper); }
  .advisor-page { position:relative; min-height:100vh; overflow:hidden; padding:clamp(24px,5vw,64px); }
  .advisor-page::after { position:fixed; right:2vw; bottom:-10vh; width:min(42vw,560px); height:88vh; background:url('/assets/pixel-justitia.png') right bottom/contain no-repeat; content:''; image-rendering:pixelated; opacity:.055; filter:grayscale(.75) sepia(.15); pointer-events:none; }

  .brand { font:600 clamp(18px,2vw,24px)/1 var(--font-display); text-decoration:none; }
  .back { font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  .advisor-file { position:relative; z-index:1; width:min(760px,100%); margin:clamp(60px,10vh,110px) auto 40px; border:1px solid var(--ink); background:var(--cream); box-shadow:6px 7px 0 var(--ink-30); }
  .filebar { display:flex; align-items:center; gap:12px; min-height:34px; padding:0 10px; border-bottom:1px solid var(--ink); font:600 14px/1 var(--font-display); }
  .filebar::before { width:14px; height:14px; border:1px solid var(--ink); content:''; }
  .filebody { padding:clamp(28px,6vw,64px); }
  .eyebrow { margin:0 0 20px; color:var(--rubric); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
  h1 { max-width:680px; margin:0; font:600 clamp(44px,8vw,82px)/.95 var(--font-display); letter-spacing:-.035em; }
  .role { max-width:52ch; margin:24px 0 0; font:400 clamp(18px,2.2vw,24px)/1.5 var(--font-display); color:var(--text-muted); }
  .links { display:flex; flex-wrap:wrap; gap:12px 24px; margin-top:36px; padding-top:20px; border-top:1px solid var(--rule-hairline); }
  .links a { color:var(--rubric); font-weight:600; }
  @media(max-width:600px){ .advisor-page{padding:18px}.advisor-file{margin-top:46px}.filebody{padding:28px 22px}.advisor-page::after{width:78vw;opacity:.04} }

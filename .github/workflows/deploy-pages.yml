# Resume GitHub Pages publishes for anavanzin.com.
# Repo Settings → Pages uses build_type=workflow, but no workflow existed after
# mid-2026 — deploys stopped at commit 3058230 (2026-07-11) while main moved on.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual dispatches must publish the production branch, never the
          # branch selected in the Actions UI.
          ref: main

      - name: Stage site tree
        run: bash scripts/stage-worker-assets.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .worker-assets

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

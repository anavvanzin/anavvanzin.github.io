  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro · Ana Vanzin</title>
  <style>
    :root {
      --paper: #f2ead9;
      --ink: #211b16;
      --rubric: #9b2c1c;
      --gold: #9c7c3d;
      --muted: rgba(33, 27, 22, 0.68);
      --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
      --mono: "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
    }

    button { font: inherit; }

    .page,
    .intro {
      position: fixed;
      inset: 0;
      min-height: 100svh;
    }

    .page {
      display: grid;
      place-items: center;
      gap: 1.5rem;
      align-content: center;
      padding: 2rem;
      text-align: center;
    }

    .seal {
      display: grid;
      width: 4.5rem;
      height: 4.5rem;
      place-items: center;
      border: 1px solid var(--gold);
      color: var(--gold);
      font: 600 1rem/1 var(--display);
      letter-spacing: 0.12em;
      transform: rotate(45deg);
    }

    .seal span { transform: rotate(-45deg); }

    .page h1 {
      margin: 0;
      font: 500 clamp(3rem, 8vw, 5.5rem)/0.9 var(--display);
    }

    .page p {
      margin: 0;
      color: var(--rubric);
      font: 600 clamp(0.68rem, 1.4vw, 0.82rem)/1.6 var(--display);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .replay,
    .skip {
      border: 0;
      background: transparent;
      cursor: pointer;
      font: 600 0.68rem/1 var(--body);
      letter-spacing: 0.18em;
      color: var(--ink);
    }

    .replay {
      display: inline-flex;
      align-items: baseline;
      gap: 0.55rem;
      margin-top: 1.1rem;
      padding: 0;
      color: var(--gold);
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: lowercase;
    }

    .replay::after {
      content: "";
      display: block;
      width: 2.6rem;
      height: 1px;
      background: currentColor;
      opacity: 0.45;
    }

    .replay:hover,
    .replay:focus-visible {
      color: var(--rubric);
    }

    .intro {
      z-index: 10;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(1.5rem, 4vw, 3rem);
      overflow: hidden;
      background: var(--paper);
      opacity: 1;
      transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.2s;
    }

    .intro[aria-hidden="true"] {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.34;
      background: repeating-linear-gradient(
        transparent 0 3px,
        rgba(33, 27, 22, 0.08) 3px 4px
      );
    }

    .stage {
      z-index: 1;
      display: grid;
      width: min(38rem, 100%);
      place-self: center;
      justify-items: center;
      gap: clamp(1.3rem, 3.4vh, 2.3rem);
    }

    .object-wrap {
      position: relative;
      width: min(43vmin, 17rem);
      aspect-ratio: 1;
    }

    #morph-object {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }

    .object-caption {
      position: absolute;
      right: 0;
      bottom: -0.2rem;
      left: 0;
      color: var(--muted);
      font: 400 0.62rem/1 var(--mono);
      letter-spacing: 0.09em;
      text-align: center;
      text-transform: lowercase;
    }

    .boot {
      width: min(22rem, 86vw);
      min-height: 6.4rem;
      color: var(--muted);
      font: 400 clamp(0.66rem, 1.5vw, 0.78rem)/1.65 var(--mono);
      letter-spacing: 0.035em;
    }

    .boot div {
      opacity: 0;
      transform: translateY(0.35rem);
      transition: opacity 240ms ease, transform 240ms ease;
    }

    .boot div.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cursor {
      display: inline-block;
      width: 0.48rem;
      height: 0.82rem;
      margin-left: 0.25rem;
      vertical-align: -0.1rem;
      background: var(--rubric);
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .progress {
      width: min(17.5rem, 62vw);
      height: 0.55rem;
      padding: 1px;
      border: 1px solid var(--gold);
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--rubric);
    }

    .system-label {
      color: var(--gold);
      font: 600 0.66rem/1 var(--display);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .skip {
      z-index: 2;
      justify-self: end;
      align-self: end;
      padding: 0.7rem 0;
      color: var(--muted);
    }

    .skip:hover,
    .skip:focus-visible { color: var(--rubric); }

    :focus-visible {
      outline: 1px solid var(--rubric);
      outline-offset: 4px;
    }

    @media (max-height: 650px) {
      .stage { gap: 1rem; }
      .object-wrap { width: min(38vmin, 13rem); }
      .boot { min-height: 4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
<script src="/intro/navigation.js" defer></script>
</head>
<body>
  <main class="page" aria-label="Página inicial de Ana Vanzin">
    <div class="seal" aria-hidden="true"><span>AV</span></div>
    <h1>ana vanzin</h1>
    <p>tese · publicações · ius gentium · advocacia · contato</p>
    <button class="replay" type="button" aria-label="Ver abertura">abertura</button>
  </main>

  <section class="intro" aria-label="Abertura animada" aria-hidden="false">
    <div class="scanlines" aria-hidden="true"></div>

    <div class="stage">
      <div class="object-wrap" aria-hidden="true">
        <svg id="morph-object" viewBox="0 0 32 32" role="img" aria-label="Ampulheta transformando-se em taça de vinho">
          <polygon id="sand-top" fill="var(--rubric)"></polygon>
          <polygon id="sand-bottom" fill="var(--rubric)"></polygon>
          <g id="sand-stream" fill="var(--rubric)">
            <rect x="15" y="14" width="1" height="1"></rect>
            <rect x="16" y="16" width="1" height="1"></rect>
            <rect x="15" y="18" width="1" height="1"></rect>
          </g>
          <polygon id="wine" fill="var(--rubric)" opacity="0"></polygon>
          <polyline id="vessel" fill="none" stroke="var(--ink)" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"></polyline>
          <g id="glints" fill="var(--gold)">
            <rect id="glint-a" width="1" height="1"></rect>
            <rect id="glint-b" width="1" height="1"></rect>
          </g>
        </svg>
        <div class="object-caption" id="object-caption">tempus</div>
      </div>

      <div class="boot" aria-live="polite">
        <div>av-os v.1494</div>
        <div>carregando justitia.png …</div>
        <div>montando /tese …</div>
        <div>transmutando tempus → vinum …</div>
        <div>abrindo anavanzin.com …</div>
        <div>pronto.<span class="cursor" aria-hidden="true"></span></div>
      </div>

      <div class="progress" aria-hidden="true"><span></span></div>
      <div class="system-label">av-os · v.1494 · anavanzin.com</div>
    </div>

    <button class="skip" type="button">pular →</button>
  </section>

  <script>
    (() => {
      const intro = document.querySelector('.intro');
      const replay = document.querySelector('.replay');
      const skip = document.querySelector('.skip');
      const progress = document.querySelector('.progress span');
      const lines = [...document.querySelectorAll('.boot > div')];
      const vessel = document.querySelector('#vessel');
      const sandTop = document.querySelector('#sand-top');
      const sandBottom = document.querySelector('#sand-bottom');
      const sandStream = document.querySelector('#sand-stream');
      const wine = document.querySelector('#wine');
      const caption = document.querySelector('#object-caption');
      const glintA = document.querySelector('#glint-a');
      const glintB = document.querySelector('#glint-b');

      const duration = 9000;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const previewParams = new URLSearchParams(location.search);
      const hasPreviewPhase = previewParams.has('phase');
      let frame = 0;
      let started = 0;

      // Both silhouettes have the same 14 semantic anchors, so every part of
      // the hourglass travels to a meaningful place on the wine glass.
      const hourglass = [
        [4, 2], [28, 2], [28, 3], [22, 9], [17, 14], [17, 16], [28, 27],
        [28, 29], [4, 29], [4, 27], [15, 16], [15, 14], [10, 9], [4, 3], [4, 2]
      ];
      const wineglass = [
        [7, 5], [25, 5], [25, 6], [23, 12], [19, 18], [17, 19], [17, 27],
        [24, 29], [8, 29], [15, 27], [15, 19], [13, 18], [9, 12], [7, 6], [7, 5]
      ];

      const clamp = (n, min = 0, max = 1) => Math.min(max, Math.max(min, n));
      const ease = n => 1 - Math.pow(1 - clamp(n), 3);
      const mix = (a, b, p) => a + (b - a) * p;
      const points = pts => pts.map(([x, y]) => `${x},${y}`).join(' ');
      const pixel = n => Math.round(n * 2) / 2;

      function draw(normalized) {
        const drain = clamp(normalized / 0.56);
        const morph = ease((normalized - 0.56) / 0.28);
        const hold = clamp((normalized - 0.84) / 0.16);

        const outline = hourglass.map((pt, i) => [
          pixel(mix(pt[0], wineglass[i][0], morph)),
          pixel(mix(pt[1], wineglass[i][1], morph))
        ]);
        vessel.setAttribute('points', points(outline));

        const topY = mix(3, 13.5, drain);
        sandTop.setAttribute('points', points([
          [5, topY], [27, topY], [17, 14], [15, 14]
        ]));
        sandTop.style.opacity = String(1 - morph);

        const baseWidth = mix(1.5, 10.5, drain);
        sandBottom.setAttribute('points', points([
          [16 - baseWidth, 27], [16 + baseWidth, 27], [16 + baseWidth * 0.72, 25], [16 - baseWidth * 0.72, 25]
        ]));
        sandBottom.style.opacity = String(1 - morph);
        sandStream.style.opacity = String((1 - morph) * (drain > 0.03 && drain < 0.98 ? 1 : 0));

        // The drained sand rises into the bowl and becomes wine during the morph.
        const wineSurface = mix(18, 10.5, morph);
        wine.setAttribute('points', points([
          [10.5, wineSurface], [21.5, wineSurface], [19, 17], [17, 18.5], [15, 18.5], [13, 17]
        ]));
        wine.style.opacity = String(morph);

        glintA.setAttribute('x', String(pixel(mix(4, 7, morph))));
        glintA.setAttribute('y', String(pixel(mix(2, 5, morph))));
        glintB.setAttribute('x', String(pixel(mix(27, 24, morph))));
        glintB.setAttribute('y', String(pixel(mix(28, 28, morph))));

        caption.textContent = morph < 0.42 ? 'tempus' : morph < 0.9 ? 'tempus · vinum' : 'vinum';
        caption.style.color = hold > 0 ? 'var(--rubric)' : 'var(--muted)';
      }

      function revealLines(normalized) {
        const count = Math.min(lines.length, 1 + Math.floor(normalized * lines.length));
        lines.forEach((line, i) => line.classList.toggle('visible', i < count));
      }

      function finish() {
        cancelAnimationFrame(frame);
        intro.setAttribute('aria-hidden', 'true');
      }

      function tick(now) {
        const normalized = clamp((now - started) / duration);
        draw(normalized);
        revealLines(normalized);
        progress.style.width = `${(normalized * 100).toFixed(1)}%`;
        if (normalized < 1) frame = requestAnimationFrame(tick);
        else setTimeout(finish, 550);
      }

      function start() {
        cancelAnimationFrame(frame);
        intro.setAttribute('aria-hidden', 'false');
        progress.style.width = '0%';
        lines.forEach(line => line.classList.remove('visible'));
        draw(0);
        if (reduced) {
          finish();
          return;
        }
        started = performance.now();
        frame = requestAnimationFrame(tick);
      }

      skip.addEventListener('click', finish);
      replay.addEventListener('click', start);
      if (hasPreviewPhase) {
        const phase = clamp(Number(previewParams.get('phase')) || 0);
        draw(phase);
        revealLines(phase);
        progress.style.width = `${(phase * 100).toFixed(1)}%`;
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
